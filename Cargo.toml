[package]
name = "simtop"
version = "0.1.0"
edition = "2021"
description = "High-performance iOS Simulator management TUI and automation CLI"
# Floor set by the dependency with the highest MSRV (ratatui 0.29, clap 4.5:
# Rust 1.74); the source itself only needs 1.70 (is_some_and). Repository,
# homepage, and license are intentionally absent: the project has not
# published them yet, and placeholders would be fabricated metadata.
rust-version = "1.74"

[profile.release]
# Binary-oriented release settings: the shipped artifact is a standalone CLI.
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "simtop"
path = "src/lib.rs"

[[bin]]
name = "simtop"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
cc = "1"
