# Release workflow: builds a universal (arm64 + x86_64) macOS `simtop` binary,
# creates a draft GitHub release, and updates the Homebrew formulae.
#
# Tags must look like `v<semver>` (for example, `v0.1.0`). The source archive
# for the tag is used by Homebrew, so its checksum is calculated from the exact
# tagged archive. The tap update is a direct commit, authenticated by the
# fine-grained HOMEBREW_TAP_TOKEN secret.
#
# The artifact is intentionally not codesigned: signing requires a Developer
# ID certificate and notarization secrets. The output is a plain universal
# Mach-O that can be signed later with real credentials.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build simtop (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload per-architecture binary
        uses: actions/upload-artifact@v4
        with:
          name: simtop-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/simtop
          if-no-files-found: error

  package:
    name: Package universal archive
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha256: ${{ steps.source.outputs.sha256 }}

    steps:
      - name: Resolve tag version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must contain a semantic version (got \"$REF_NAME\")"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download per-architecture binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: simtop-*-apple-darwin
          merge-multiple: false

      - name: Restore executable permissions
        run: |
          chmod +x \
            dist/simtop-aarch64-apple-darwin/simtop \
            dist/simtop-x86_64-apple-darwin/simtop

      - name: Create universal binary
        run: |
          mkdir -p universal
          lipo -create \
            dist/simtop-aarch64-apple-darwin/simtop \
            dist/simtop-x86_64-apple-darwin/simtop \
            -output universal/simtop

      - name: Verify universal binary
        run: |
          test -x universal/simtop
          file universal/simtop
          lipo -info universal/simtop

      - name: Smoke-test binary
        run: ./universal/simtop --version

      - name: Package universal archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="simtop-${VERSION}-darwin-universal"
          mkdir -p "${STAGE}/bin"
          cp universal/simtop "${STAGE}/bin/simtop"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Compute tagged source checksum
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="simtop-${VERSION}-source.tar.gz"
          SOURCE_URL="https://github.com/${SOURCE_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$SOURCE_ARCHIVE" "$SOURCE_URL"
          SOURCE_SHA256="$(shasum -a 256 "$SOURCE_ARCHIVE" | awk '{print $1}')"
          printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" > "${SOURCE_ARCHIVE}.sha256"
          echo "sha256=${SOURCE_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: simtop-darwin-universal
          path: |
            simtop-*.tar.gz
            simtop-*.tar.gz.sha256
          if-no-files-found: error

  sync_source_formula:
    name: Update source formula
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update formula metadata
        env:
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_SHA256: ${{ needs.package.outputs.source_sha256 }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/simtop.rb")
          text = path.read_text()
          version = os.environ["VERSION"]
          source_sha256 = os.environ["SOURCE_SHA256"]
          source_repository = os.environ["SOURCE_REPOSITORY"]
          source_url = (
              f"https://github.com/{source_repository}/archive/refs/tags/"
              f"v{version}.tar.gz"
          )

          text, url_count = re.subn(
              r'^  url "https://github\\.com/[^"]+/archive/refs/tags/'
              r'v[^"]+\\.tar\\.gz"$',
              f'  url "{source_url}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text, sha_count = re.subn(
              r'^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{source_sha256}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if url_count != 1 or sha_count != 1:
              raise SystemExit(
                  f"expected one URL and one SHA-256 in {path}, "
                  f"found {url_count} and {sha_count}"
              )
          path.write_text(text)
          PY

      - name: Commit formula update
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/simtop.rb; then
            echo "Source formula is already current."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/simtop.rb
          git commit -m "Update Homebrew formula for v${VERSION}"
          git push origin HEAD:main

  release:
    name: Draft GitHub release
    needs: [package, sync_source_formula]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download universal archive
        uses: actions/download-artifact@v4
        with:
          name: simtop-darwin-universal
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  update_tap:
    name: Update Homebrew tap
    needs: [package, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.package.outputs.version }}
      SOURCE_SHA256: ${{ needs.package.outputs.source_sha256 }}
      SOURCE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Require tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN to a fine-grained token with Contents write access to noahlin34/homebrew-tap."
            exit 1
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: noahlin34/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update tap formula
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/simtop.rb")
          text = path.read_text()
          version = os.environ["VERSION"]
          source_sha256 = os.environ["SOURCE_SHA256"]
          source_repository = os.environ["SOURCE_REPOSITORY"]
          source_url = (
              f"https://github.com/{source_repository}/archive/refs/tags/"
              f"v{version}.tar.gz"
          )

          text, url_count = re.subn(
              r'^  url "https://github\\.com/[^"]+/archive/refs/tags/'
              r'v[^"]+\\.tar\\.gz"$',
              f'  url "{source_url}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text, sha_count = re.subn(
              r'^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{source_sha256}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if url_count != 1 or sha_count != 1:
              raise SystemExit(
                  f"expected one URL and one SHA-256 in {path}, "
                  f"found {url_count} and {sha_count}"
              )
          path.write_text(text)
          PY

      - name: Commit tap update
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/simtop.rb; then
            echo "Tap formula is already current."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/simtop.rb
          git commit -m "Update simtop to v${VERSION}"
          git push origin HEAD:main
